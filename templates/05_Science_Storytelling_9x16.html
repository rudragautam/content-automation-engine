<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Science Storytelling</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05080b;color:#fff;font-family:system-ui,sans-serif}.container{width:min(100vw,calc(100dvh*9/16));height:100dvh;margin:auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.container::-webkit-scrollbar{display:none}.slide{position:relative;width:100%;height:100dvh;min-height:100dvh;aspect-ratio:9/16;scroll-snap-align:start;overflow:hidden}.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.18;transform:scale(1.04);z-index:-3}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,#05080baa,#05080b55 45%,#05080be8);z-index:-2}.grid{position:absolute;inset:0;background-image:linear-gradient(#53d9ff0a 1px,transparent 1px),linear-gradient(90deg,#53d9ff0a 1px,transparent 1px);background-size:30px 30px}.content{position:absolute;top:50%;transform:translateY(-50%);width:78%;padding:8%;background:#061016a8;border:1px solid #ffffff16;backdrop-filter:blur(14px);border-radius:20px}.left{left:8%}.right{right:8%}.center{left:50%;transform:translate(-50%,-50%);text-align:center}.chapter{font-size:10px;letter-spacing:4px;color:#64e7ff}.title{font-size:clamp(28px,7vw,55px);line-height:1.03;margin:15px 0}.text{font-size:clamp(15px,3.7vw,21px);line-height:1.7;color:#b8c7ce}.progress{position:absolute;top:0;left:0;width:100%;height:3px;background:#ffffff10;z-index:10}.fill{width:0;height:100%;background:#5ce5ff}
</style></head><body><main class="container" id="app"></main><script>
const storyData=[
{chapter:"SCIENCE",title:"WHEN THE SKY WAS OUR FIRST LABORATORY",text:"Long before modern instruments existed, humans looked toward the sky to understand time, seasons and the world around them.",image:"https://images.meesho.com/images/products/594204987/dffbl_512.webp?width=512",textPosition:"left"},
{chapter:"ANCIENT KNOWLEDGE",title:"WE LEARNED BY WATCHING THE STARS",text:"The movement of the Sun, Moon and stars helped ancient civilizations build calendars and understand recurring patterns in nature.",image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKlHZ5IAWf6LHNxjlJ4rAp8U4ZVcsGMtp8mJ2Ig0oxvKITchhSPrLoLV0&s=10",textPosition:"right"},
{chapter:"ASTRONOMY",title:"THE UNIVERSE BECAME A QUESTION",text:"Every observation created another question. Why do objects move? Why does light travel? What lies beyond what we can see?",image:"https://m.media-amazon.com/images/I/81RWMOR+P-L._AC_UF894,1000_QL80_.jpg",textPosition:"left"},
{chapter:"THE BIG IDEA",title:"CURIOSITY BECAME SCIENCE",text:"Science grows from a simple human habit: observe carefully, question honestly, and keep searching for a better explanation.",image:"https://m.media-amazon.com/images/I/61lGjT0bYkL._AC_UF894,1000_QL80_.jpg",textPosition:"center"}];
const app=document.getElementById("app");
function build(){app.innerHTML=`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="grid"></div><div class="content center"><div class="chapter">KNOWLEDGE • STORY</div><h1 class="title">SCIENCE THROUGH TIME</h1><p class="text">A journey from ancient observation to the questions that shaped science.</p></div></section>`+storyData.map(d=>`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="bg" style="background-image:url('${d.image}')"></div><div class="overlay"></div><div class="grid"></div><div class="content ${d.textPosition}"><div class="chapter">${d.chapter}</div><h2 class="title">${d.title}</h2><p class="text">${d.text}</p></div></section>`).join("")}
build();const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const f=e.target.querySelector(".fill");if(f){f.style.transition="none";f.style.width="0";requestAnimationFrame(()=>{f.style.transition="width 8s linear";f.style.width="100%"})}}}),{root:app,threshold:.65});document.querySelectorAll(".slide").forEach(s=>io.observe(s));
</script></body></html>
