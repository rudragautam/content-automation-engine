<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Science Quiz</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#04090d;color:#eafcff;font-family:system-ui,sans-serif}.container{width:min(100vw,calc(100dvh*9/16));height:100dvh;margin:auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.container::-webkit-scrollbar{display:none}.slide{position:relative;width:100%;height:100dvh;min-height:100dvh;aspect-ratio:9/16;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:7%;overflow:hidden}.slide:before{content:"";position:absolute;inset:0;background:linear-gradient(#00d5ff08 1px,transparent 1px),linear-gradient(90deg,#00d5ff08 1px,transparent 1px);background-size:35px 35px}.card{position:relative;width:100%;padding:9%;border:1px solid #52dfff2b;background:#07141acc;border-radius:22px;box-shadow:0 0 60px #00d5ff0d;backdrop-filter:blur(15px)}.tag{font-size:10px;letter-spacing:3px;color:#57e8ff;margin-bottom:15px}.q{font-size:clamp(25px,6vw,46px);line-height:1.1;margin:0 0 25px}.option{display:block;width:100%;margin:9px 0;padding:13px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff08;color:#eafcff;text-align:left;cursor:pointer}.correct{background:#104f46!important}.wrong{background:#5b2329!important}.explain{margin-top:14px;color:#a8cbd1;font-size:13px;line-height:1.5}.progress{position:absolute;top:0;left:0;width:100%;height:3px;background:#ffffff10;z-index:3}.fill{width:0;height:100%;background:#4de5ff}
</style><style id="responsive">
/* Preview-only. The 9:16 column is limited by viewport height on wide screens, so type follows the column width (cqi) instead of the viewport width (vw). When the column is the full viewport width, which is true at every video render size, cqi equals vw and the layout is unchanged. */
.container{container-type:inline-size}
.q{font-size:clamp(25px,6cqi,46px)}
/* Phone held sideways: a 9:16 column would be too narrow to read, so widen it and tighten spacing. */
@media (orientation:landscape) and (max-height:500px){.container{width:min(100vw,600px)}.slide{padding:2% 4%}.card{padding:3% 5%;border-radius:16px}.tag{margin-bottom:6px}.q{font-size:20px;margin-bottom:8px}.option{display:inline-block;width:calc(50% - 3px);margin:3px 0;padding:8px 10px;font-size:13px}.option:nth-of-type(odd){margin-right:6px}.explain{margin-top:6px;font-size:12px}.card p{margin:8px 0 0}}
</style></head><body><main class="container" id="app"></main><script>
const quizData=[
{category:"PHYSICS",question:"What force keeps planets in orbit around the Sun?",options:["Magnetism","Gravity","Friction","Electricity"],correct:"B",explanation:"Gravity provides the inward force that keeps planets in orbital motion."},
{category:"BIOLOGY",question:"Which part of a cell contains most of its genetic material?",options:["Cell wall","Nucleus","Ribosome","Cytoplasm"],correct:"B",explanation:"In eukaryotic cells, most DNA is stored inside the nucleus."},
{category:"CHEMISTRY",question:"What is the chemical symbol for oxygen?",options:["Ox","O","Og","C"],correct:"B",explanation:"O is the standard chemical symbol for oxygen."},
{category:"ASTRONOMY",question:"What galaxy contains our Solar System?",options:["Andromeda","Triangulum","Milky Way","Whirlpool"],correct:"C",explanation:"Our Solar System is located in the Milky Way galaxy."}];
const introData={title:"Think You Know Science?",text:"Four questions. One score."};
const app=document.getElementById("app");let score=0;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function build(){app.innerHTML=`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="card"><div class="tag">SCIENCE LAB • QUIZ</div><h1 class="q">${esc(introData.title)}</h1><p>${esc(introData.text)}</p></div></section>`+quizData.map((d,i)=>`<section class="slide quiz" data-i="${i}"><div class="progress"><div class="fill"></div></div><div class="card"><div class="tag">${esc(d.category)} • ${i+1}/${quizData.length}</div><h2 class="q">${esc(d.question)}</h2>${d.options.map((o,j)=>`<button class="option" data-a="${String.fromCharCode(65+j)}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join("")}<div class="explain"></div></div></section>`).join("")+`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="card"><div class="tag">RESULT</div><h2 class="q" id="result">0 / ${quizData.length}</h2><p>Science rewards curiosity. Keep questioning.</p></div></section>`}
function reveal(s){const d=quizData[+s.dataset.i];s.querySelectorAll(".option").forEach(x=>{if(x.dataset.a===d.correct)x.classList.add("correct")});s.querySelector(".explain").textContent=d.explanation}
function wire(){document.querySelectorAll(".quiz").forEach(s=>s.querySelectorAll(".option").forEach(b=>b.onclick=()=>{if(s.dataset.done)return;s.dataset.done=1;reveal(s);if(b.dataset.a===quizData[+s.dataset.i].correct)score++;else b.classList.add("wrong");setTimeout(()=>s.nextElementSibling.scrollIntoView({behavior:"smooth"}),1400)}))}
function fillBar(s,ms,sel){document.querySelectorAll(sel).forEach(x=>{x.style.transition="none";x.style.width="0"});const f=s.querySelector(sel);if(f)requestAnimationFrame(()=>{f.style.transition="width "+ms+"ms linear";f.style.width="100%"})}
function show(s,ms){fillBar(s,ms,".fill");const r=s.querySelector("#result");if(r)r.textContent=`${score} / ${quizData.length}`}
build();wire();const io=new IntersectionObserver(es=>es.forEach(e=>{if(window.__engine&&window.__engine.driven)return;if(e.isIntersecting)show(e.target,8000)}),{root:app,threshold:.65});document.querySelectorAll(".slide").forEach(s=>io.observe(s));
window.__engine={driven:false,count:document.querySelectorAll(".slide").length,goTo(i,ms){this.driven=true;ms=ms||8000;const s=document.querySelectorAll(".slide")[i];s.scrollIntoView({behavior:"instant",block:"start",inline:"start"});fillBar(s,ms,".fill");if(s.classList.contains("quiz")){const d=quizData[+s.dataset.i];setTimeout(()=>reveal(s),d.reveal!=null?d.reveal:ms*.55)}const r=s.querySelector("#result");if(r){r.textContent=`? / ${quizData.length}`;r.nextElementSibling.textContent="Comment your score below!"}}};
</script></body></html>
