<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Indian Heritage Science Story — 16:9</title>
<style>
:root{--bg:#090706;--cream:#f5ead2;--muted:rgba(245,234,210,.72);--gold:#d9ad5c;--gold-light:#f0d28a;--saffron:#d27a32;--image-opacity:.25}. *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:"Noto Serif",Georgia,serif}.story-container{width:100vw;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none}.story-container::-webkit-scrollbar{display:none}.slide{position:relative;width:100vw;height:100dvh;min-height:100dvh;aspect-ratio:16/9;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;isolation:isolate}.story-image{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:var(--image-opacity);transform:scale(1.04);filter:saturate(.82) contrast(1.05);z-index:-5;transition:transform 1.2s}.slide.active .story-image{transform:scale(1.09)}.image-overlay{position:absolute;inset:0;background:linear-gradient(90deg,#090706f2,#090706b3 28%,#09070661 58%,#090706c7),linear-gradient(#090706a6,transparent 30%,#090706e0);z-index:-4}.manuscript{position:absolute;inset:0;opacity:.1;background:repeating-linear-gradient(0deg,transparent 0 3px,#f0d28a09 4px);z-index:-3}.mandala{position:absolute;width:55vw;height:55vw;border-radius:50%;border:1px solid #d9ad5c14;right:-12%;bottom:-35%;z-index:-2}.mandala:before,.mandala:after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid #d9ad5c12}.mandala:after{inset:18%;border-style:dashed}.frame{position:absolute;inset:18px;border:1px solid #d9ad5c8c;z-index:10}.frame:before{content:"";position:absolute;inset:7px;border:1px solid #d9ad5c2e}.corner{position:absolute;width:48px;height:48px;border-color:var(--gold-light);border-style:solid}.tl{top:-1px;left:-1px;border-width:3px 0 0 3px}.tr{top:-1px;right:-1px;border-width:3px 3px 0 0}.bl{bottom:-1px;left:-1px;border-width:0 0 3px 3px}.br{bottom:-1px;right:-1px;border-width:0 3px 3px 0}.top-bar{position:absolute;top:34px;left:60px;right:60px;display:flex;justify-content:space-between;z-index:20;font-size:11px;letter-spacing:3px;color:#f5ead29e}.brand{display:flex;align-items:center;gap:12px}.brand-symbol{font-size:25px;color:var(--gold-light)}.story-content{position:absolute;top:50%;transform:translateY(-50%);width:min(720px,52vw);z-index:15}.left{left:7vw}.right{right:7vw}.center{left:50%;transform:translate(-50%,-50%);text-align:center}.chapter{display:flex;gap:12px;align-items:center;margin-bottom:18px;font-size:12px;letter-spacing:4px;color:var(--gold-light);text-transform:uppercase}.chapter:before{content:"";width:38px;height:1px;background:var(--gold)}.center .chapter{justify-content:center}.story-title{margin:0;font-size:clamp(34px,4.2vw,68px);line-height:1.05;letter-spacing:-1px}.divider{display:flex;align-items:center;gap:12px;margin:25px 0}.divider-line{width:75px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}.story-text{margin:0;max-width:650px;font-size:clamp(16px,1.45vw,23px);line-height:1.75;color:var(--muted)}.bottom-info{position:absolute;left:60px;right:60px;bottom:34px;display:flex;justify-content:space-between;z-index:20;font-size:11px;letter-spacing:3px;color:#f5ead28c}.progress-track{position:absolute;top:0;left:0;width:100%;height:3px;background:#fff1;z-index:30}.progress-fill{width:0;height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold-light))}.intro{display:flex;align-items:center;justify-content:center;text-align:center}.intro-content{width:min(900px,80vw);position:relative;z-index:20}.intro-om{font-size:74px;color:var(--gold-light);margin-bottom:25px}.intro-kicker{font-size:12px;letter-spacing:6px;color:var(--gold-light);margin-bottom:20px}.intro-title{margin:0;font-size:clamp(42px,6vw,88px);line-height:.98}.intro-subtitle{margin:26px auto 0;max-width:700px;font-size:clamp(16px,1.5vw,23px);line-height:1.7;color:var(--muted)}
</style></head><body><div class="story-container" id="storyContainer"></div><script>
const storyData=[{chapter:"SCIENCE",title:"WHEN THE SKY WAS OUR FIRST LABORATORY",text:"Long before modern instruments existed, humans looked toward the sky to understand time, seasons and the world around them.",image:"https://images.meesho.com/images/products/594204987/dffbl_512.webp?width=512",textPosition:"left"},{chapter:"ANCIENT KNOWLEDGE",title:"WE LEARNED BY WATCHING THE STARS",text:"The movement of the Sun, Moon and stars helped ancient civilizations build calendars and understand recurring patterns in nature.",image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKlHZ5IAWf6LHNxjlJ4rAp8U4ZVcsGMtp8mJ2Ig0oxvKITchhSPrLoLV0&s=10",textPosition:"right"},{chapter:"ASTRONOMY",title:"THE UNIVERSE BECAME A QUESTION",text:"Every observation created another question. Why do objects move? Why does light travel? What lies beyond what we can see?",image:"https://m.media-amazon.com/images/I/81RWMOR+P-L._AC_UF894,1000_QL80_.jpg",textPosition:"left"},{chapter:"THE BIG IDEA",title:"CURIOSITY BECAME SCIENCE",text:"Science grows from a simple human habit: observe carefully, question honestly, and keep searching for a better explanation.",image:"https://m.media-amazon.com/images/I/61lGjT0bYkL._AC_UF894,1000_QL80_.jpg",textPosition:"center"}];
const c=document.getElementById("storyContainer");function intro(){return `<section class="slide intro"><div class="progress-track"><div class="progress-fill"></div></div><div class="manuscript"></div><div class="mandala"></div><div class="frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div><div class="intro-content"><div class="intro-om">ॐ</div><div class="intro-kicker">KNOWLEDGE • STORY</div><h1 class="intro-title">SCIENCE<br>THROUGH TIME</h1><p class="intro-subtitle">A journey from ancient observation to the questions that shaped science.</p></div></section>`}function scene(d,i){return `<section class="slide"><div class="progress-track"><div class="progress-fill"></div></div><div class="story-image" style="background-image:url('${d.image}')"></div><div class="image-overlay"></div><div class="manuscript"></div><div class="mandala"></div><div class="frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div><div class="top-bar"><div class="brand"><div class="brand-symbol">ॐ</div><div>INDIAN KNOWLEDGE</div></div><div>KNOWLEDGE • STORY</div></div><div class="story-content ${d.textPosition}"><div class="chapter">${d.chapter}</div><h2 class="story-title">${d.title}</h2><div class="divider"><div class="divider-line"></div><div>✦</div></div><p class="story-text">${d.text}</p></div><div class="bottom-info"><div>SCENE ${String(i+1).padStart(2,"0")}</div><div>अध्याय ${i+1}</div></div></section>`}c.innerHTML=intro()+storyData.map(scene).join("");const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".progress-fill").forEach(x=>{x.style.transition="none";x.style.width="0"});const f=e.target.querySelector(".progress-fill");if(f)requestAnimationFrame(()=>{f.style.transition="width 8s linear";f.style.width="100%"})}}),{root:c,threshold:.65});document.querySelectorAll(".slide").forEach(s=>io.observe(s));
</script></body></html>
