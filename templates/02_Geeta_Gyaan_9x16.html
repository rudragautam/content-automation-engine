<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Geeta Gyaan</title>
<style>
:root{--bg:#080604;--cream:#f7e7bf;--gold:#d8aa55;--muted:rgba(247,231,191,.72);--image-opacity:.075;--duration:8s}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:Georgia,serif}
.container{width:min(100vw,calc(100dvh*9/16));height:100dvh;margin:auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.container::-webkit-scrollbar{display:none}
.slide{position:relative;width:100%;height:100dvh;min-height:100dvh;aspect-ratio:9/16;overflow:hidden;scroll-snap-align:start;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:var(--image-opacity);z-index:-3}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,4,.7),rgba(8,6,4,.9));z-index:-2}
.frame{position:absolute;inset:15px;border:1px solid rgba(216,170,85,.55)}.frame:before{content:"";position:absolute;inset:7px;border:1px solid rgba(216,170,85,.18)}
.card{width:82%;padding:9%;background:rgba(20,12,5,.48);border-left:3px solid var(--gold);backdrop-filter:blur(10px)}
.om{font-size:48px;color:var(--gold);margin-bottom:18px}.chapter{font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:15px}.title{font-size:clamp(27px,7vw,54px);line-height:1.05;margin:0}.text{font-size:clamp(15px,3.8vw,22px);line-height:1.75;color:var(--muted)}.progress{position:absolute;top:0;left:0;width:100%;height:3px;background:#ffffff14;z-index:10}.fill{height:100%;width:0;background:var(--gold)}
</style></head><body><main class="container" id="app"></main><script>
const slidesData=[
{chapter:"कर्म",title:"कर्म करते जाओ",text:"अपने कर्म पर अधिकार रखो, परिणाम की चिंता में अपने वर्तमान को मत खोओ।",image:"krishna.jpg"},
{chapter:"धैर्य",title:"मन को स्थिर रखो",text:"जब मन स्थिर होता है, तब कठिन परिस्थितियों में भी सही निर्णय दिखाई देने लगता है।",image:"krishna.jpg"},
{chapter:"सत्य",title:"सत्य का मार्ग",text:"सही मार्ग हमेशा आसान नहीं होता, लेकिन वही भीतर की शांति की ओर ले जाता है।",image:"krishna.jpg"},
{chapter:"ज्ञान",title:"ज्ञान भीतर से जागता है",text:"प्रश्न करना शुरुआत है; अनुभव, चिंतन और सत्य की खोज ज्ञान को गहरा बनाते हैं।",image:"krishna.jpg"}];
const app=document.getElementById("app");
function build(){app.innerHTML=`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="frame"></div><div class="card"><div class="om">ॐ</div><div class="chapter">GEETA GYAAN</div><h1 class="title">श्रीमद्भगवद्गीता से जीवन के सूत्र</h1><p class="text">एक विचार। एक सीख। एक नया दृष्टिकोण।</p></div></section>`+slidesData.map((d,i)=>`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="bg" style="background-image:url('${d.image}')"></div><div class="overlay"></div><div class="frame"></div><div class="card"><div class="om">ॐ</div><div class="chapter">${d.chapter}</div><h2 class="title">${d.title}</h2><p class="text">${d.text}</p></div></section>`).join("")}
build();const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".fill").forEach(x=>{x.style.transition="none";x.style.width="0"});const f=e.target.querySelector(".fill");if(f)requestAnimationFrame(()=>{f.style.transition="width 8s linear";f.style.width="100%"})}}),{root:app,threshold:.65});document.querySelectorAll(".slide").forEach(s=>io.observe(s));
</script></body></html>
