<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Indian Traditional Story</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b0705;color:#f5ead2;font-family:"Noto Serif",Georgia,serif}.container{width:min(100vw,calc(100dvh*9/16));height:100dvh;margin:auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.container::-webkit-scrollbar{display:none}.slide{position:relative;width:100%;height:100dvh;min-height:100dvh;aspect-ratio:9/16;scroll-snap-align:start;overflow:hidden}.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.30;z-index:-3}.overlay{position:absolute;inset:0;background:linear-gradient(90deg,#0b0705ee,#0b070577,#0b0705ee),linear-gradient(#0b0705aa,transparent 35%,#0b0705ee);z-index:-2}.texture{position:absolute;inset:0;opacity:.1;background:repeating-linear-gradient(0deg,transparent 0 3px,#d9ad5c08 4px)}.frame{position:absolute;inset:16px;border:1px solid #d9ad5c88}.frame:before{content:"";position:absolute;inset:7px;border:1px solid #d9ad5c33}.content{position:absolute;top:50%;transform:translateY(-50%);width:72%;padding:7%;background:#140d0ab0;border-left:3px solid #d9ad5c;backdrop-filter:blur(10px)}.left{left:8%}.right{right:8%}.center{left:50%;transform:translate(-50%,-50%);text-align:center}.chapter{font-size:10px;letter-spacing:4px;color:#e6c77e}.title{font-size:clamp(28px,7vw,56px);line-height:1.03;margin:15px 0}.text{font-size:clamp(15px,3.7vw,21px);line-height:1.75;color:#d8c9ae}.om{font-size:42px;color:#e6c77e}.progress{position:absolute;top:0;left:0;width:100%;height:3px;background:#fff1}.fill{height:100%;width:0;background:#d9ad5c}
</style><style id="responsive">
/* Preview-only. The 9:16 column is limited by viewport height on wide screens, so type follows the column width (cqi) instead of the viewport width (vw). When the column is the full viewport width, which is true at every video render size, cqi equals vw and the layout is unchanged. */
.container{container-type:inline-size}
.title{font-size:clamp(28px,7cqi,56px)}.text{font-size:clamp(15px,3.7cqi,21px)}
/* Phone held sideways: a 9:16 column would be too narrow to read, so widen it and tighten spacing. */
@media (orientation:landscape) and (max-height:500px){.container{width:min(100vw,600px)}.content{width:84%;padding:3% 5%}.left{left:8%}.right{right:8%}.om{font-size:26px}.title{font-size:22px;margin:6px 0}.text{font-size:14px;line-height:1.5;margin:0}}
</style></head><body><main class="container" id="app"></main><script>
const storyData=[
{chapter:"SCIENCE",title:"WHEN THE SKY WAS OUR FIRST LABORATORY",text:"Long before modern instruments existed, humans looked toward the sky to understand time, seasons and the world around them.",image:"https://images.meesho.com/images/products/594204987/dffbl_512.webp?width=512",textPosition:"left"},
{chapter:"ANCIENT KNOWLEDGE",title:"WE LEARNED BY WATCHING THE STARS",text:"The movement of the Sun, Moon and stars helped ancient civilizations build calendars and understand recurring patterns in nature.",image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKlHZ5IAWf6LHNxjlJ4rAp8U4ZVcsGMtp8mJ2Ig0oxvKITchhSPrLoLV0&s=10",textPosition:"right"},
{chapter:"ASTRONOMY",title:"THE UNIVERSE BECAME A QUESTION",text:"Every observation created another question. Why do objects move? Why does light travel? What lies beyond what we can see?",image:"https://m.media-amazon.com/images/I/81RWMOR+P-L._AC_UF894,1000_QL80_.jpg",textPosition:"left"},
{chapter:"THE BIG IDEA",title:"CURIOSITY BECAME SCIENCE",text:"Science grows from a simple human habit: observe carefully, question honestly, and keep searching for a better explanation.",image:"https://m.media-amazon.com/images/I/61lGjT0bYkL._AC_UF894,1000_QL80_.jpg",textPosition:"center"}];
const introData={kicker:"KNOWLEDGE • STORY",title:"SCIENCE THROUGH TIME",text:"ज्ञान की यात्रा — observation से discovery तक."};
const app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function bg(u){return u?"background-image:url('"+String(u).replace(/'/g,"%27").replace(/"/g,"%22")+"')":""}
function pos(p){return ["left","right","center"].includes(p)?p:"left"}
function build(){app.innerHTML=`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="texture"></div><div class="frame"></div><div class="content center"><div class="om">ॐ</div><div class="chapter">${esc(introData.kicker)}</div><h1 class="title">${esc(introData.title)}</h1><p class="text">${esc(introData.text)}</p></div></section>`+storyData.map(d=>`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="bg" style="${bg(d.image)}"></div><div class="overlay"></div><div class="texture"></div><div class="frame"></div><div class="content ${pos(d.textPosition)}"><div class="om">ॐ</div><div class="chapter">${esc(d.chapter)}</div><h2 class="title">${esc(d.title)}</h2><p class="text">${esc(d.text)}</p></div></section>`).join("")}
function fillBar(s,ms,sel){document.querySelectorAll(sel).forEach(x=>{x.style.transition="none";x.style.width="0"});const f=s.querySelector(sel);if(f)requestAnimationFrame(()=>{f.style.transition="width "+ms+"ms linear";f.style.width="100%"})}
function show(s,ms){fillBar(s,ms,".fill")}
build();const io=new IntersectionObserver(es=>es.forEach(e=>{if(window.__engine&&window.__engine.driven)return;if(e.isIntersecting)show(e.target,8000)}),{root:app,threshold:.65});document.querySelectorAll(".slide").forEach(s=>io.observe(s));
window.__engine={driven:false,count:document.querySelectorAll(".slide").length,goTo(i,ms){this.driven=true;ms=ms||8000;const s=document.querySelectorAll(".slide")[i];s.scrollIntoView({behavior:"instant",block:"start",inline:"start"});show(s,ms)}};
</script></body></html>
