<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Crime Files — Cinematic Series</title>
<style>
:root{--bg:#050607;--white:#eeeeea;--muted:rgba(238,238,234,.68);--red:#b51f28;--red-light:#e3484f;--image-opacity:.30}. *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:var(--white);font-family:"Oswald",Arial,sans-serif}.container{width:100vw;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none}.container::-webkit-scrollbar{display:none}.slide{position:relative;width:100vw;height:100dvh;min-height:100dvh;aspect-ratio:16/9;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;isolation:isolate}.crime-image{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:var(--image-opacity);transform:scale(1.04);filter:grayscale(.25) contrast(1.18) brightness(.72);z-index:-5;transition:transform 1.5s}.slide.active .crime-image{transform:scale(1.09)}.image-overlay{position:absolute;inset:0;background:linear-gradient(90deg,#030506f7,#030506c7 27%,#03050659 58%,#030506e0),linear-gradient(#000d,transparent 32%,#000000eb);z-index:-4}.grain{position:absolute;inset:0;opacity:.075;background:repeating-linear-gradient(0deg,transparent 0 2px,#fff1 3px);z-index:-2}.red-glow{position:absolute;width:45vw;height:45vw;border-radius:50%;right:-15%;top:15%;background:radial-gradient(circle,#b51f2826,transparent 68%);z-index:-3}.frame{position:absolute;inset:18px;border:1px solid #fff3;z-index:20}.frame:before{content:"";position:absolute;inset:7px;border:1px solid #b51f2852}.corner{position:absolute;width:45px;height:45px;border-color:var(--red-light);border-style:solid}.tl{top:-1px;left:-1px;border-width:3px 0 0 3px}.tr{top:-1px;right:-1px;border-width:3px 3px 0 0}.bl{bottom:-1px;left:-1px;border-width:0 0 3px 3px}.br{bottom:-1px;right:-1px;border-width:0 3px 3px 0}.progress-track{position:absolute;top:0;left:0;width:100%;height:3px;background:#fff1;z-index:30}.progress-fill{width:0;height:100%;background:linear-gradient(90deg,var(--red),var(--red-light))}.top-bar{position:absolute;top:32px;left:60px;right:60px;display:flex;align-items:center;justify-content:space-between;z-index:25;font-size:11px;letter-spacing:3px;color:#eeeaa;text-transform:uppercase}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:30px;height:30px;border:1px solid var(--red);display:flex;align-items:center;justify-content:center;transform:rotate(45deg);color:var(--red-light)}.brand-mark span{transform:rotate(-45deg)}.case-status{display:flex;align-items:center;gap:8px}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--red-light);box-shadow:0 0 10px var(--red);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35}}.story-content{position:absolute;top:50%;transform:translateY(-50%);width:min(760px,54vw);z-index:15}.left{left:7vw}.right{right:7vw}.center{left:50%;transform:translate(-50%,-50%);text-align:center}.chapter{display:flex;align-items:center;gap:12px;margin-bottom:17px;font-size:12px;letter-spacing:4px;color:var(--red-light);text-transform:uppercase}.chapter:before{content:"";width:38px;height:1px;background:var(--red)}.center .chapter{justify-content:center}.story-title{margin:0;font-size:clamp(38px,4.5vw,76px);line-height:.98;text-transform:uppercase;font-weight:600;text-shadow:0 5px 25px #000b}.divider{display:flex;align-items:center;gap:12px;margin:25px 0}.divider-line{width:80px;height:2px;background:linear-gradient(90deg,var(--red),transparent)}.story-text{margin:0;max-width:680px;font-family:"Special Elite","Courier New",monospace;font-size:clamp(15px,1.35vw,21px);line-height:1.75;color:var(--muted)}.case-number{position:absolute;right:7vw;bottom:13vh;font-size:clamp(90px,15vw,220px);font-weight:700;color:#fff09;line-height:.8;pointer-events:none;z-index:-1}.bottom-info{position:absolute;left:60px;right:60px;bottom:32px;display:flex;justify-content:space-between;z-index:25;font-size:10px;letter-spacing:3px;color:#eeeaa}.intro{display:flex;align-items:center;justify-content:center;text-align:center}.intro-content{position:relative;width:min(1000px,82vw);z-index:15}.intro-kicker{margin-bottom:22px;font-size:12px;letter-spacing:7px;color:var(--red-light);text-transform:uppercase}.intro-title{margin:0;font-size:clamp(58px,8vw,120px);line-height:.88;letter-spacing:-3px;font-weight:600;text-transform:uppercase}.intro-title span{color:var(--red-light)}.intro-subtitle{margin:30px auto 0;max-width:700px;font-family:"Special Elite",monospace;font-size:clamp(15px,1.4vw,21px);line-height:1.7;color:var(--muted)}
</style><style id="responsive">
/* Preview-only. Below 900px wide the 16:9 layout reflows: text spans the width, the side bars tighten, the type scales down and the case number moves below the text. Video renders at 1920x1080 and never matches. */
@media (max-width:900px){.story-content,.left,.right,.center{left:7vw;right:7vw;width:auto;transform:translateY(-50%)}.story-title{font-size:clamp(28px,7vw,44px)}.story-text{font-size:14px;line-height:1.65}.divider{margin:16px 0}.top-bar,.bottom-info{left:34px;right:34px;font-size:9px;letter-spacing:2px}.case-number{font-size:clamp(64px,18vw,130px);bottom:72px}.intro-title{font-size:clamp(46px,13vw,80px);letter-spacing:-2px}}
@media (max-width:900px) and (max-height:500px){.story-content{top:54%}.story-title{font-size:26px}.story-text{font-size:13px;line-height:1.5}.divider{margin:8px 0}.chapter{margin-bottom:8px}.case-number{display:none}.intro-kicker{margin-bottom:10px}.intro-subtitle{margin-top:14px}}
</style></head><body><main class="container" id="app"></main><script>
const crimeData=[{chapter:"CASE FILE 001",title:"THE NIGHT THE CITY WENT SILENT",text:"It was raining heavily that night. The streets were almost empty. Then, somewhere in the darkness, a crime changed everything.",image:"https://thumbs.dreamstime.com/b/rainy-night-crime-scene-investigation-city-background-rainy-night-crime-scene-investigation-city-background-366669846.jpg",textPosition:"left"},{chapter:"EVIDENCE",title:"A SINGLE LINE OF TAPE",text:"By morning, yellow crime scene tape had sealed the street. Investigators knew one thing: whoever did this had left something behind.",image:"https://static.vecteezy.com/system/resources/thumbnails/070/021/077/small/yellow-crime-scene-tape-stretches-across-a-dark-urban-street-at-night-with-blurred-emergency-lights-in-the-background-free-photo.jpeg",textPosition:"right"},{chapter:"THE CLUE",title:"THE MARK ON THE WALL",text:"Inside the abandoned room, investigators found a disturbing mark on the wall. Was it a warning, a signature, or simply an attempt to mislead them?",image:"https://png.pngtree.com/thumb_back/fw800/background/20250817/pngtree-blood-stained-wall-featuring-a-framed-vivid-red-handprint-creating-dark-image_18071004.webp",textPosition:"left"},{chapter:"THE QUESTION",title:"BUT WHO WAS REALLY THERE?",text:"Three clues. One location. And a timeline that did not make sense. The deeper investigators looked, the stranger the case became.",image:"https://thumbs.dreamstime.com/b/rainy-night-crime-scene-investigation-city-background-rainy-night-crime-scene-investigation-city-background-366669846.jpg",textPosition:"center"}];
const introData={kicker:"A CINEMATIC CRIME SERIES",title:"CRIME FILES",text:"Every crime leaves a story. Every story leaves a clue."};
const app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function bg(u){return u?"background-image:url('"+String(u).replace(/'/g,"%27").replace(/"/g,"%22")+"')":""}
function pos(p){return ["left","right","center"].includes(p)?p:"left"}
function accentLast(t){const w=String(t||"").trim().split(/\s+/);if(w.length<2)return esc(t);return esc(w.slice(0,-1).join(" "))+" <span>"+esc(w[w.length-1])+"</span>"}
function build(){app.innerHTML=`<section class="slide intro"><div class="progress-track"><div class="progress-fill"></div></div><div class="grain"></div><div class="red-glow"></div><div class="frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div><div class="intro-content"><div class="intro-kicker">${esc(introData.kicker)}</div><h1 class="intro-title">${accentLast(introData.title)}</h1><p class="intro-subtitle">${esc(introData.text)}</p></div></section>`+crimeData.map((d,i)=>`<section class="slide"><div class="progress-track"><div class="progress-fill"></div></div><div class="crime-image" style="${bg(d.image)}"></div><div class="image-overlay"></div><div class="grain"></div><div class="red-glow"></div><div class="frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div><div class="top-bar"><div class="brand"><div class="brand-mark"><span>CF</span></div><div>CRIME FILES</div></div><div class="case-status"><span class="status-dot"></span>CASE ${String(i+1).padStart(3,"0")}</div></div><div class="story-content ${pos(d.textPosition)}"><div class="chapter">${esc(d.chapter)}</div><h2 class="story-title">${esc(d.title)}</h2><div class="divider"><div class="divider-line"></div><div>◆</div></div><p class="story-text">${esc(d.text)}</p></div><div class="case-number">${String(i+1).padStart(2,"0")}</div><div class="bottom-info"><div>SCENE ${String(i+1).padStart(2,"0")}</div><div>EVIDENCE LOG // ${String(i+1).padStart(2,"0")}</div></div></section>`).join("")}
function fillBar(s,ms,sel){document.querySelectorAll(sel).forEach(x=>{x.style.transition="none";x.style.width="0"});const f=s.querySelector(sel);if(f)requestAnimationFrame(()=>{f.style.transition="width "+ms+"ms linear";f.style.width="100%"})}
function show(s,ms){fillBar(s,ms,".progress-fill")}
build();const io=new IntersectionObserver(es=>es.forEach(e=>{if(window.__engine&&window.__engine.driven)return;if(e.isIntersecting)show(e.target,8000)}),{root:app,threshold:.65});document.querySelectorAll(".slide").forEach(s=>io.observe(s));
window.__engine={driven:false,count:document.querySelectorAll(".slide").length,goTo(i,ms){this.driven=true;ms=ms||8000;const s=document.querySelectorAll(".slide")[i];s.scrollIntoView({behavior:"instant",block:"start",inline:"start"});show(s,ms)}};
</script></body></html>
