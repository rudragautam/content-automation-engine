<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiz Shorts</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07080d;color:#fff;font-family:system-ui,sans-serif}.container{width:min(100vw,calc(100dvh*9/16));height:100dvh;margin:auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.container::-webkit-scrollbar{display:none}.slide{position:relative;width:100%;height:100dvh;min-height:100dvh;aspect-ratio:9/16;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:7%;overflow:hidden}.slide:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,rgba(90,120,255,.2),transparent 45%)}.card{width:100%;padding:9%;border:1px solid #ffffff1a;background:#ffffff09;backdrop-filter:blur(18px);border-radius:25px}.tag{font-size:11px;letter-spacing:3px;color:#78e7ff;margin-bottom:14px}.q{font-size:clamp(24px,6vw,45px);line-height:1.1;margin:0 0 25px}.options{display:grid;gap:10px}.option{padding:14px;border:1px solid #ffffff1a;border-radius:12px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer;font-size:15px}.option.correct{background:#174d32}.option.wrong{background:#5b2027}.explain{font-size:13px;line-height:1.5;color:#bfc4d1;margin-top:15px}.progress{position:absolute;top:0;left:0;width:100%;height:3px;background:#ffffff10}.fill{height:100%;width:0;background:linear-gradient(90deg,#8d7cff,#5fe7ff)}
</style><style id="responsive">
/* Preview-only. The 9:16 column is limited by viewport height on wide screens, so type follows the column width (cqi) instead of the viewport width (vw). When the column is the full viewport width, which is true at every video render size, cqi equals vw and the layout is unchanged. */
.container{container-type:inline-size}
.q{font-size:clamp(24px,6cqi,45px)}
/* Phone held sideways: a 9:16 column would be too narrow to read, so widen it and tighten spacing. */
@media (orientation:landscape) and (max-height:500px){.container{width:min(100vw,600px)}.slide{padding:2% 4%}.card{padding:3% 5%;border-radius:18px}.tag{margin-bottom:6px}.q{font-size:20px;margin-bottom:10px}.options{grid-template-columns:1fr 1fr;gap:6px}.option{padding:8px 10px;font-size:13px}.explain{margin-top:8px;font-size:12px}.card p{margin:8px 0 0}}
</style></head><body><main class="container" id="app"></main><script>
const quizData = [
  {
    "category": "",
    "question": "Test",
    "text": ""
  }
];

const introData={title:"Can You Score 4/4?",text:"Swipe up and test yourself."};
const app=document.getElementById("app");let score=0;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function build(){app.innerHTML=`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="card"><div class="tag">KNOWLEDGE BATTLE</div><h1 class="q">${esc(introData.title)}</h1><p>${esc(introData.text)}</p></div></section>`+quizData.map((d,i)=>`<section class="slide quiz" data-i="${i}"><div class="progress"><div class="fill"></div></div><div class="card"><div class="tag">${esc(d.category)} • QUESTION ${i+1}</div><h2 class="q">${esc(d.question)}</h2><div class="options">${d.options.map((o,j)=>`<button class="option" data-answer="${String.fromCharCode(65+j)}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join("")}</div><div class="explain"></div></div></section>`).join("")+`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="card"><div class="tag">FINAL SCORE</div><h2 class="q" id="score">0 / ${quizData.length}</h2><p>Great job. Try again and beat your score.</p></div></section>`}
function reveal(s){const d=quizData[+s.dataset.i];s.querySelectorAll(".option").forEach(x=>{if(x.dataset.answer===d.correct)x.classList.add("correct")});s.querySelector(".explain").textContent=d.explanation}
function wire(){document.querySelectorAll(".quiz").forEach(s=>s.querySelectorAll(".option").forEach(b=>b.onclick=()=>{if(s.dataset.done)return;s.dataset.done=1;reveal(s);if(b.dataset.answer===quizData[+s.dataset.i].correct)score++;else b.classList.add("wrong");setTimeout(()=>s.nextElementSibling.scrollIntoView({behavior:"smooth"}),1400)}))}
function fillBar(s,ms,sel){document.querySelectorAll(sel).forEach(x=>{x.style.transition="none";x.style.width="0"});const f=s.querySelector(sel);if(f)requestAnimationFrame(()=>{f.style.transition="width "+ms+"ms linear";f.style.width="100%"})}
function show(s,ms){fillBar(s,ms,".fill");const r=s.querySelector("#score");if(r)r.textContent=`${score} / ${quizData.length}`}
build();wire();const io=new IntersectionObserver(es=>es.forEach(e=>{if(window.__engine&&window.__engine.driven)return;if(e.isIntersecting)show(e.target,8000)}),{root:app,threshold:.65});document.querySelectorAll(".slide").forEach(s=>io.observe(s));
window.__engine={driven:false,count:document.querySelectorAll(".slide").length,goTo(i,ms){this.driven=true;ms=ms||8000;const s=document.querySelectorAll(".slide")[i];s.scrollIntoView({behavior:"instant",block:"start",inline:"start"});fillBar(s,ms,".fill");if(s.classList.contains("quiz")){const d=quizData[+s.dataset.i];setTimeout(()=>reveal(s),d.reveal!=null?d.reveal:ms*.55)}const r=s.querySelector("#score");if(r){r.textContent=`? / ${quizData.length}`;r.nextElementSibling.textContent="Comment your score below!"}}};
</script></body></html>
