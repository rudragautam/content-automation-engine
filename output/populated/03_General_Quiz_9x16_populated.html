<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiz Shorts</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07080d;color:#fff;font-family:system-ui,sans-serif}.container{width:min(100vw,calc(100dvh*9/16));height:100dvh;margin:auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.container::-webkit-scrollbar{display:none}.slide{position:relative;width:100%;height:100dvh;min-height:100dvh;aspect-ratio:9/16;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:7%;overflow:hidden}.slide:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,rgba(90,120,255,.2),transparent 45%)}.card{width:100%;padding:9%;border:1px solid #ffffff1a;background:#ffffff09;backdrop-filter:blur(18px);border-radius:25px}.tag{font-size:11px;letter-spacing:3px;color:#78e7ff;margin-bottom:14px}.q{font-size:clamp(24px,6vw,45px);line-height:1.1;margin:0 0 25px}.options{display:grid;gap:10px}.option{padding:14px;border:1px solid #ffffff1a;border-radius:12px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer;font-size:15px}.option.correct{background:#174d32}.option.wrong{background:#5b2027}.explain{font-size:13px;line-height:1.5;color:#bfc4d1;margin-top:15px}.progress{position:absolute;top:0;left:0;width:100%;height:3px;background:#ffffff10}.fill{height:100%;width:0;background:linear-gradient(90deg,#8d7cff,#5fe7ff)}
</style></head><body><main class="container" id="app"></main><script>
const quizData = [
  {
    "category": "",
    "question": "Test",
    "text": ""
  }
];

const app=document.getElementById("app");let score=0,answered=false;
function build(){app.innerHTML=`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="card"><div class="tag">KNOWLEDGE BATTLE</div><h1 class="q">Can You Score 4/4?</h1><p>Swipe up and test yourself.</p></div></section>`+quizData.map((d,i)=>`<section class="slide quiz" data-i="${i}"><div class="progress"><div class="fill"></div></div><div class="card"><div class="tag">${d.category} • QUESTION ${i+1}</div><h2 class="q">${d.question}</h2><div class="options">${d.options.map((o,j)=>`<button class="option" data-answer="${String.fromCharCode(65+j)}">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}</div><div class="explain"></div></div></section>`).join("")+`<section class="slide"><div class="progress"><div class="fill"></div></div><div class="card"><div class="tag">FINAL SCORE</div><h2 class="q" id="score">0 / ${quizData.length}</h2><p>Great job. Try again and beat your score.</p></div></section>`}
function wire(){document.querySelectorAll(".quiz").forEach(s=>s.querySelectorAll(".option").forEach(b=>b.onclick=()=>{if(s.dataset.done)return;s.dataset.done=1;const i=+s.dataset.i,d=quizData[i],ans=b.dataset.answer;s.querySelectorAll(".option").forEach(x=>{if(x.dataset.answer===d.correct)x.classList.add("correct")});if(ans===d.correct)score++;else b.classList.add("wrong");s.querySelector(".explain").textContent=d.explanation;setTimeout(()=>s.nextElementSibling.scrollIntoView({behavior:"smooth"}),1400)}));}
function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".fill").forEach(x=>{x.style.transition="none";x.style.width="0"});const f=e.target.querySelector(".fill");if(f)requestAnimationFrame(()=>{f.style.transition="width 8s linear";f.style.width="100%"});if(e.target.id==="score")e.target.textContent=`${score} / ${quizData.length}`}}),{root:app,threshold:.65});document.querySelectorAll(".slide").forEach(s=>io.observe(s))}
build();wire();observe();
</script></body></html>
